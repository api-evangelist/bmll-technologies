aid: bmll-technologies
url: https://raw.githubusercontent.com/api-evangelist/bmll-technologies/refs/heads/main/apis.yml
name: BMLL Technologies
kind: company
description: BMLL is a London-based provider of harmonised historical Level 3, 2,
  and 1 order book data and analytics for capital markets, covering global equities,
  ETFs, futures, and options. Acquired by Nordic Capital in October 2025 (with Optiver
  as minority shareholder), BMLL sells its data through the BMLL Data Lab hosted Python
  environment, the BMLL Data Feed file product, and entitlement-gated REST APIs
  (Reference Data, Time-Series, Market Data, and an async query APIv2) documented
  publicly via the bmll Python SDK on PyPI, with delivery over API, S3, SFTP, and
  Snowflake. There is no self-serve signup - access is sales-led with key-pair
  credentials issued per account.
