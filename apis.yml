apis:
- aid: bmll-technologies:bmll-reference-data-api
  name: BMLL Reference Data API
  tags:
  - Reference Data
  - Instruments
  - Markets
  - Listings
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://pypi.org/project/bmll/
  baseURL: https://reference.data.bmlltech.com
  properties:
  - url: https://pypi.org/project/bmll/
    type: Documentation
  - url: https://data.bmlltech.com
    type: Portal
  description: Query reference data for the instruments, listings, and markets in
    the BMLL universe (equities, ETFs, futures, options), including availability by
    data type (LOB, listing/instrument/market-level metrics, DataFeed) and ETF
    constituent data. Documented publicly through the bmll Python SDK
    (ReferenceDataClient); the host is live but requires entitled key-pair
    credentials (probed 403 without auth).
- aid: bmll-technologies:bmll-time-series-api
  name: BMLL Time-Series API
  tags:
  - Time Series
  - Analytics
  - Order Book
  - Metrics
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://pypi.org/project/bmll/
  baseURL: https://time-series.data.bmlltech.com
  properties:
  - url: https://pypi.org/project/bmll/
    type: Documentation
  - url: https://data.bmlltech.com
    type: Portal
  description: Daily time-series metrics and analytics derived from BMLL's
    harmonised Level 3 order book history, including classified trades, queried by
    instrument, listing, or market. Documented publicly through the bmll Python SDK
    (TimeSeriesClient); the host is live but requires entitled key-pair credentials
    (probed 403 without auth).
- aid: bmll-technologies:bmll-market-data-api
  name: BMLL Market Data API
  tags:
  - Market Data
  - Market State
  - CBBO
  - Quotes
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://pypi.org/project/bmll/
  baseURL: https://market-data.data.bmlltech.com
  properties:
  - url: https://pypi.org/project/bmll/
    type: Documentation
  - url: https://data.bmlltech.com
    type: Portal
  description: Retrieve per-instrument market state and consolidated best bid and
    offer (CBBO) for listings on a given day, with an async poll-for-result request
    pattern. Documented publicly through the bmll Python SDK (MarketDataClient);
    the host is live but requires entitled key-pair credentials (probed 403 without
    auth).
- aid: bmll-technologies:bmll-api-v2
  name: BMLL APIv2 Query API
  tags:
  - Datasets
  - Query
  - Async
  - Historical Data
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://pypi.org/project/bmll/
  baseURL: https://api.data.bmlltech.com
  properties:
  - url: https://pypi.org/project/bmll/
    type: Documentation
  - url: https://data.bmlltech.com
    type: Portal
  description: Asynchronous dataset query API (initiate query, poll, download
    results as JSONL/Arrow into pandas or polars) over BMLL datasets, including a
    timeseries query endpoint. An OpenAPI definition exists at
    https://api.data.bmlltech.com/openapi.json but it returned HTTP 401
    Unauthorized when probed, so it could not be harvested. Documented publicly
    through the bmll Python SDK (ApiV2Client).
